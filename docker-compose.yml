# Disposable local databases for this package's own test suite:
# `docker compose up -d` before `mix test` / `mix precommit`.
# Override with PERIODICAL_ECTO_POSTGRES_URL / PERIODICAL_ECTO_MYSQL_URL.
services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: periodical
      POSTGRES_PASSWORD: periodical
      POSTGRES_DB: periodical_ecto_test
    ports:
      - "5442:5432"
  mariadb:
    image: mariadb:11.8.8
    environment:
      MARIADB_USER: periodical
      MARIADB_PASSWORD: periodical
      MARIADB_DATABASE: periodical_ecto_test
      MARIADB_ROOT_PASSWORD: periodical
    ports:
      - "3316:3306"
