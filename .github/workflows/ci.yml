name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  PERIODICAL_ECTO_POSTGRES_URL: ecto://periodical:periodical@localhost:5442/periodical_ecto_test
  PERIODICAL_ECTO_MYSQL_URL: ecto://periodical:periodical@localhost:3316/periodical_ecto_test

jobs:
  ci:
    name: OTP ${{ matrix.otp }} / Elixir 1.19.5
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: periodical
          POSTGRES_PASSWORD: periodical
          POSTGRES_DB: periodical_ecto_test
        ports: ["5442:5432"]
        options: >-
          --health-cmd "pg_isready -U periodical" --health-interval 2s --health-timeout 2s --health-retries 15
      mariadb:
        image: mariadb:11.8.8
        env:
          MARIADB_USER: periodical
          MARIADB_PASSWORD: periodical
          MARIADB_DATABASE: periodical_ecto_test
          MARIADB_ROOT_PASSWORD: periodical
        ports: ["3316:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 2s --health-timeout 2s --health-retries 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - otp: "28"
            elixir: "1.19.5-otp-28"
          - otp: "27"
            elixir: "1.19.5-otp-27"
          - otp: "26"
            elixir: "1.19.5-otp-26"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Restore deps/_build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.exs') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Precommit
        run: mix precommit

      - name: Verify package assembles (hex.build)
        run: mix hex.build
